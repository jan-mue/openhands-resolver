[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling==1.32.4" ]

[project]
name = "openhands-resolver"
version = "0.4.0"
description = "OpenHands Issue Resolver"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "All Hands AI" } ]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "openhands-sdk==1.58.1",
    "openhands-tools==1.58.1",
    "pydantic==2.14.1",
    "termcolor==3.3.0",
]
urls.Issues = "https://github.com/All-Hands-AI/openhands-resolver/issues"
urls.Repository = "https://github.com/All-Hands-AI/openhands-resolver"
scripts.openhands-resolver = "openhands.resolver.resolve_issue:main"
scripts.openhands-resolver-send-pr = "openhands.resolver.send_pull_request:main"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "hatchling==1.32.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.17.0",
]

[tool.hatch]
build.targets.wheel.packages = [ "openhands" ]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [ "openhands/resolver/patching" ]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "DOC",  # pydoclint
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "ERA",  # no commented-out code
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D",       # Docstrings are disabled for now
    "E501",    # Line too long, handled by formatter
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PT013",   # Incorrect import of pytest
    "RUF012",  # Mutable class attributes should be annotated as ClassVar
    "S603",    # subprocess calls use fixed, controlled argument lists
    "S607",    # Starting a process with a partial executable path (git is resolved via PATH)
    "TC006",   # Add quotes to type expression in typing.cast()
]
per-file-ignores."__init__.py" = [ "D104", "F401" ]
per-file-ignores."tests/**" = [ "D", "PLR2004", "S" ]
per-file-ignores."tests/unit/resolver/github/test_pr_handler_guess_success.py" = [ "SLF001" ]
per-file-ignores."tests/unit/resolver/gitlab/test_gitlab_pr_handler_guess_success.py" = [ "SLF001" ]
flake8-tidy-imports.ban-relative-imports = "all"
isort.known-first-party = [ "openhands" ]
pydocstyle.convention = "google"

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
expand_tables = [ "tool.pytest.ini_options", "tool.ruff" ]

[tool.ty]
src.include = [ "openhands", "tests" ]
src.exclude = [ "openhands/resolver/patching" ]
environment.python-version = "3.12"
rules.missing-override-decorator = "error"
rules.unresolved-import = "warn"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
